name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore bridge/WildsDeck.Bridge.slnx
      - run: dotnet build bridge/WildsDeck.Bridge.slnx --configuration Release --no-restore
      - run: dotnet test bridge/WildsDeck.Bridge.slnx --configuration Release --no-build

  streamdeck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - working-directory: streamdeck
        run: npm ci
      - working-directory: streamdeck
        run: npm run check
      - working-directory: streamdeck
        run: npm test
      - working-directory: streamdeck
        run: npm run build
      - working-directory: streamdeck
        run: npm run validate
      - run: unzip -t "streamdeck/com.wildsdeck.streamdeck.sdPlugin/WildsDeck - Town.streamDeckProfile"
      - run: unzip -t "streamdeck/com.wildsdeck.streamdeck.sdPlugin/WildsDeck - Hunt.streamDeckProfile"
